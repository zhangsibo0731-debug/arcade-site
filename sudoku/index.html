<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E7E9EE" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="数独" />
<title>数独 · Sudoku</title>
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin />
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
<link rel="manifest" href="../manifest.json" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
</head>
<body>
<main class="app">
  <header class="app__header">
    <div class="app__header-left">
      <a class="icon-btn" href="../" aria-label="返回游戏厅" title="返回游戏厅">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="m12 19-7-7 7-7" />
        </svg>
      </a>
      <div class="brand">
        <h1 class="brand__title">数独</h1>
        <p class="brand__sub">SUDOKU · 数字的逻辑</p>
      </div>
    </div>
    <button class="icon-btn" id="btnNewTop" type="button" aria-label="新游戏" title="新游戏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 2.6-6.4" />
        <path d="M3 3v5h5" />
      </svg>
    </button>
  </header>

  <section class="difficulty" id="difficulty" role="tablist" aria-label="难度选择">
    <button class="difficulty__btn is-active" data-level="easy" type="button" role="tab" aria-selected="true">简单</button>
    <button class="difficulty__btn" data-level="medium" type="button" role="tab" aria-selected="false">中等</button>
    <button class="difficulty__btn" data-level="hard" type="button" role="tab" aria-selected="false">困难</button>
  </section>

  <section class="stats" aria-label="游戏统计">
    <div class="stat">
      <span class="stat__value" id="timer">00:00</span>
      <span class="stat__label">用时</span>
    </div>
    <div class="stat">
      <span class="stat__value" id="mistakes">0</span>
      <span class="stat__label">失误</span>
    </div>
    <div class="stat">
      <span class="stat__value" id="bestTime">--:--</span>
      <span class="stat__label">最佳</span>
    </div>
  </section>

  <section class="board-wrap" aria-label="数独棋盘">
    <div class="board" id="board" role="grid" aria-label="九宫格棋盘"></div>
  </section>

  <section class="controls" aria-label="操作区">
    <div class="numpad" id="numpad" role="group" aria-label="数字键盘"></div>
    <div class="actions">
      <button class="action" id="btnNotes" type="button" data-action="notes" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        <span>笔记</span>
      </button>
      <button class="action" id="btnUndo" type="button" data-action="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
        </svg>
        <span>撤销</span>
      </button>
      <button class="action" id="btnErase" type="button" data-action="erase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m4 20 7.2-7.2a1 1 0 0 0 0-1.4L9.9 10a2 2 0 0 0-2.8 0L4 13.1Z" />
          <path d="M20 5 7.9 17.1" />
          <path d="m10 7.1 6.9 6.9" />
        </svg>
        <span>擦除</span>
      </button>
      <button class="action" id="btnHint" type="button" data-action="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18h6" />
          <path d="M10 21h4" />
          <path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1.1 1.6 1.1 2.5h5.8c0-.9.3-1.8 1.1-2.5A6 6 0 0 0 12 3Z" />
        </svg>
        <span>提示</span>
        <span class="action__badge" id="hintCount">3</span>
      </button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__badge">完成</div>
    <h2 class="modal__title" id="modalTitle">解出来了！</h2>
    <p class="modal__time" id="modalTime">00:00</p>
    <p class="modal__meta" id="modalMeta">简单 · 0 失误</p>
    <button class="modal__btn" id="btnPlayAgain" type="button">再来一局</button>
  </div>
</div>

<div class="overlay" id="resumeOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal__badge modal__badge--resume">上次进度</div>
    <h2 class="modal__title">继续上次的对局？</h2>
    <p class="modal__meta" id="resumeMeta">简单 · 用时 00:00</p>
    <div class="modal__actions">
      <button class="modal__btn modal__btn--ghost" id="btnResumeNew" type="button">新开一局</button>
      <button class="modal__btn" id="btnResumeContinue" type="button">继续上次</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
